<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="coldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="640" fill="url(#bgGrad)" rx="16"/>

  <rect x="25" y="20" width="950" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="500" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc" text-anchor="middle">KIẾN TRÚC GRADLE DEPENDENCY CACHING TRÊN GITHUB ACTIONS</text>
  <text x="500" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">actions/setup-java@v5 with cache: 'gradle' • Cache Key Hashing • Tiết kiệm 67% thời gian thực thi</text>

  <!-- Left: Run 1 (Cold Cache) -->
  <g transform="translate(35, 105)">
    <rect width="320" height="400" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="320" height="40" rx="12" fill="url(#coldGrad)"/>
    <text x="160" y="26" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">LẦN 1: CHƯA CÓ CACHE (COLD RUN)</text>

    <g transform="translate(15, 55)">
      <rect width="290" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="145" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#fca5a5" text-anchor="middle">Trạng thái: Cache Miss</text>
      <text x="145" y="42" font-family="monospace" font-size="9" fill="#f87171" text-anchor="middle">Cache not found for input keys</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="290" height="110" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
      <text x="145" y="22" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#fee2e2" text-anchor="middle">TẢI TÀI NGUYÊN TỪ INTERNET</text>
      <text x="15" y="45" font-family="sans-serif" font-size="9" fill="#fecaca">• Tải Gradle 8.5 bin zip: 135 MB</text>
      <text x="15" y="65" font-family="sans-serif" font-size="9" fill="#fecaca">• Tải Spring Boot dependencies: 110 MB</text>
      <text x="15" y="85" font-family="sans-serif" font-size="9" fill="#fecaca">• Tải JUnit &amp; Jackson libraries: 45 MB</text>
      <text x="15" y="102" font-family="sans-serif" font-size="8.5" fill="#fca5a5">Mất nhiều thời gian băng thông mạng</text>
    </g>

    <g transform="translate(15, 245)">
      <rect width="290" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="145" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Thời gian thực thi chi tiết</text>
      <text x="15" y="45" font-family="monospace" font-size="9.5" fill="#fca5a5">./gradlew test:    28 giay</text>
      <text x="15" y="63" font-family="monospace" font-size="9.5" fill="#fca5a5">./gradlew bootJar: 21 giay</text>
    </g>

    <g transform="translate(15, 330)">
      <rect width="290" height="55" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
      <text x="145" y="24" font-family="sans-serif" font-size="10" font-weight="700" fill="#fca5a5" text-anchor="middle">TỔNG THỜI GIAN JOB 1:</text>
      <text x="145" y="44" font-family="sans-serif" font-size="16" font-weight="700" fill="#f87171" text-anchor="middle">58 GIÂY</text>
    </g>
  </g>

  <!-- Middle: GitHub Cache Storage Hub -->
  <g transform="translate(385, 105)">
    <rect width="230" height="400" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.8" filter="url(#shadow)"/>
    <rect width="230" height="40" rx="12" fill="url(#hubGrad)"/>
    <text x="115" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">GITHUB ACTIONS CACHE</text>

    <!-- Save Cache Arrow from Run 1 -->
    <path d="M -30 200 L 0 200" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,4"/>
    <text x="-15" y="190" font-family="sans-serif" font-size="8" fill="#f87171" text-anchor="middle">Save</text>

    <!-- Cache Bucket Details -->
    <g transform="translate(15, 55)">
      <rect width="200" height="75" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="100" y="22" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#c084fc" text-anchor="middle">Cơ chế Cache Key</text>
      <text x="10" y="42" font-family="monospace" font-size="8" fill="#93c5fd">gradle-Linux-x64-</text>
      <text x="10" y="56" font-family="monospace" font-size="7.5" fill="#fef08a">hash(build.gradle)</text>
      <text x="100" y="70" font-family="sans-serif" font-size="7.5" fill="#94a3b8" text-anchor="middle">Băm nội dung dependency</text>
    </g>

    <g transform="translate(15, 140)">
      <rect width="200" height="110" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="100" y="22" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#c084fc" text-anchor="middle">Thư mục được lưu</text>
      <text x="10" y="44" font-family="monospace" font-size="8" fill="#cbd5e1">~/.gradle/caches/</text>
      <text x="10" y="60" font-family="sans-serif" font-size="7.5" fill="#94a3b8">(Mọi file jar phụ thuộc)</text>
      
      <text x="10" y="80" font-family="monospace" font-size="8" fill="#cbd5e1">~/.gradle/wrapper/</text>
      <text x="10" y="96" font-family="sans-serif" font-size="7.5" fill="#94a3b8">(Bộ cài Gradle 8.5 bin)</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="200" height="125" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1"/>
      <text x="100" y="22" font-family="sans-serif" font-size="10" font-weight="700" fill="#6ee7b7" text-anchor="middle">LỢI ÍCH DEVOPS</text>
      <text x="10" y="44" font-family="sans-serif" font-size="8" fill="#a7f3d0">• Dung lượng cache: 95 MB</text>
      <text x="10" y="62" font-family="sans-serif" font-size="8" fill="#a7f3d0">• Tốc độ khôi phục: 1.8s</text>
      <text x="10" y="80" font-family="sans-serif" font-size="8" fill="#a7f3d0">• Tiết kiệm mạng GitHub</text>
      <text x="10" y="98" font-family="sans-serif" font-size="8" fill="#a7f3d0">• Tăng tốc độ CI pipeline</text>
      <text x="10" y="114" font-family="sans-serif" font-size="7.5" fill="#fef08a">Không tốn quota mạng</text>
    </g>

    <!-- Restore Cache Arrow to Run 2 -->
    <path d="M 230 200 L 260 200" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,4"/>
    <text x="245" y="190" font-family="sans-serif" font-size="8" fill="#34d399" text-anchor="middle">Restore</text>
  </g>

  <!-- Right: Run 2 (Warm Cache) -->
  <g transform="translate(645, 105)">
    <rect width="320" height="400" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)"/>
    <rect width="320" height="40" rx="12" fill="url(#warmGrad)"/>
    <text x="160" y="26" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">LẦN 2: ĐÃ CÓ CACHE (WARM RUN)</text>

    <g transform="translate(15, 55)">
      <rect width="290" height="60" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1"/>
      <text x="145" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">Trạng thái: Cache HIT 100%</text>
      <text x="145" y="42" font-family="monospace" font-size="8.5" fill="#fef08a" text-anchor="middle">Cache restored successfully (1.8s)</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="290" height="110" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="145" y="22" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#34d399" text-anchor="middle">BỎ QUA TOÀN BỘ TẢI MẠNG</text>
      <text x="15" y="45" font-family="sans-serif" font-size="9" fill="#a7f3d0">• Gradle bin có sẵn trong cache</text>
      <text x="15" y="65" font-family="sans-serif" font-size="9" fill="#a7f3d0">• Dependencies có sẵn trong cache</text>
      <text x="15" y="85" font-family="sans-serif" font-size="9" fill="#a7f3d0">• Biên dịch và chạy test ngay lập tức</text>
      <text x="15" y="102" font-family="sans-serif" font-size="8.5" fill="#6ee7b7">Thời gian tải mạng = 0 giây!</text>
    </g>

    <g transform="translate(15, 245)">
      <rect width="290" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="145" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Thời gian thực thi chi tiết</text>
      <text x="15" y="45" font-family="monospace" font-size="9.5" fill="#34d399">./gradlew test:    6 giay (nhanh gap 4.6x)</text>
      <text x="15" y="63" font-family="monospace" font-size="9.5" fill="#34d399">./gradlew bootJar: 8 giay (nhanh gap 2.6x)</text>
    </g>

    <g transform="translate(15, 330)">
      <rect width="290" height="55" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
      <text x="145" y="24" font-family="sans-serif" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">TỔNG THỜI GIAN JOB 2 (GIẢM 67%):</text>
      <text x="145" y="44" font-family="sans-serif" font-size="16" font-weight="700" fill="#34d399" text-anchor="middle">19 GIÂY (SIÊU TỐC)</text>
    </g>
  </g>

  <!-- Bottom workflow summary -->
  <g transform="translate(35, 520)">
    <rect width="930" height="100" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">KẾT LUẬN TỐI ƯU HÓA CI BẰNG DEPENDENCY CACHING:</text>
    <text x="30" y="50" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• Chỉ cần thêm một dòng cấu hình cache: 'gradle' vào bước actions/setup-java@v5, thời gian CI giảm từ 58s xuống 19s.</text>
    <text x="30" y="70" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• Cơ chế Cache Key tự động vô hiệu hóa và cập nhật khi có thay đổi trong build.gradle, đảm bảo luôn tải đúng thư viện mới.</text>
  </g>
</svg>
