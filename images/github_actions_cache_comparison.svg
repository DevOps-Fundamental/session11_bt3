          <text x="15" y="405" font-family="sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">TỔNG KẾT RUN 2 (TỐI ƯU SIÊU TỐC):</text>
          <text x="15" y="425" font-family="sans-serif" font-size="10" fill="#cbd5e1">• Setup-java: 2s (Khôi phục cache thần tốc)</text>
          <text x="15" y="443" font-family="sans-serif" font-size="10" fill="#cbd5e1">• ./gradlew test: 6s (Nhanh gấp 4.6 lần)</text>
          <text x="15" y="461" font-family="sans-serif" font-size="10" fill="#cbd5e1">• ./gradlew bootJar: 8s (Nhanh gấp 2.6 lần)</text>
          <text x="15" y="479" font-family="sans-serif" font-size="11" font-weight="700" fill="#3fb950">• TỔNG THỜI GIAN: 19 GIÂY (GIẢM 67.2%)</text>
