          <line x1="0" y1="240" x2="405" y2="240" stroke="#30363d"/>

          <text y="260" fill="#58a6ff">&gt; Step: Đóng gói bootJar</text>
          <text y="278" fill="#3fb950" font-weight="bold">BUILD SUCCESSFUL in 8s (Giảm từ 21s xuống 8s)</text>

          <line x1="0" y1="295" x2="405" y2="295" stroke="#30363d"/>

          <text y="315" fill="#58a6ff">&gt; Post Step: Cache Gradle Dependencies</text>
          <text y="333" fill="#cbd5e1">Cache size unchanged. Skip uploading.</text>

