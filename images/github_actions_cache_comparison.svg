    <text x="56" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">GitHub Actions Log Comparison: First Push (No Cache) vs Second Push (With Cache)</text>
    <text x="56" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#8b949e">Workflow: Java Spring Boot CI (Gradle) • Parameter: cache: 'gradle' • Branch: main</text>

