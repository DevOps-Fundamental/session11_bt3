        <rect y="28" width="435" height="10" fill="#022c22"/>
        <text x="15" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">RUN 2: LẦN PUSH TIẾP THEO (ĐÃ CÓ CACHE)</text>
