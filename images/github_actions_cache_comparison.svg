          <text x="15" y="461" font-family="sans-serif" font-size="10" fill="#cbd5e1">• ./gradlew bootJar: 21s</text>
          <text x="15" y="479" font-family="sans-serif" font-size="11" font-weight="700" fill="#f87171">• TỔNG THỜI GIAN: 58 GIÂY</text>
